# SIFT production stack for a single Ubuntu 24.04 VPS (4 vCPU / 8 GB RAM / 120 GB NVMe).
# Process counts are tunable from .env: API_WORKERS, WORKER_PROCESSES, WORKER_THREADS.
#   docker compose up -d --build
# Only nginx publishes ports. Postgres and Redis are reachable only inside the Docker network.

name: sift

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-backend: &backend
  image: sift-backend:latest
  build: { context: ./backend }
  env_file: .env
  init: true
  restart: unless-stopped
  logging: *logging
  networks: [internal]
  volumes:
    - uploads:/data/uploads
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *logging
    networks: [internal]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 1g
    mem_limit: 3g

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *logging
    networks: [internal]
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redisdata:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    mem_limit: 256m

  api:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${API_WORKERS:-4}",
              "--proxy-headers", "--forwarded-allow-ips", "*", "--no-server-header"]
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/healthcheck", "http://127.0.0.1:8000/readyz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1g
    cpus: 2.0

  worker:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    command: ["dramatiq", "app.workers.actors", "--processes", "${WORKER_PROCESSES:-2}", "--threads", "${WORKER_THREADS:-6}",
              "--queues", "search_priority", "search", "maintenance"]
    mem_limit: 1536m
    cpus: 2.0

  scheduler:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    command: ["python", "-m", "app.workers.scheduler"]
    mem_limit: 192m

  bot:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    command: ["python", "-m", "app.bot.main"]
    mem_limit: 256m

  nginx:
    build:
      context: .
      dockerfile: infrastructure/nginx/Dockerfile
    image: sift-nginx:latest
    restart: unless-stopped
    logging: *logging
    networks: [internal]
    depends_on:
      api: { condition: service_started }
    environment:
      DOMAIN: ${DOMAIN}
      BOT_WEBHOOK_PATH: ${BOT_WEBHOOK_PATH:-/tg/webhook}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 96m

  certbot:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/renew-loop.sh"]
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
      - ./infrastructure/certbot/renew-loop.sh:/renew-loop.sh:ro
    mem_limit: 128m

  backup:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *logging
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
    volumes:
      - ./backups:/backups
      - ./infrastructure/backup/backup-loop.sh:/backup-loop.sh:ro
    mem_limit: 128m

networks:
  internal:

volumes:
  pgdata:
  redisdata:
  uploads:
  certbot-www:
  letsencrypt:
