user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent $request_time "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=1r/s;
    limit_req_status 429;

    upstream api_upstream { server api:8000; keepalive 16; }
    upstream bot_upstream { server bot:8081; }

    # Immutable hashed assets, revalidated SPA shell, API decides for itself (empty = header not added).
    map $uri $sift_cache_control {
        ~^/assets/          "public, max-age=31536000, immutable";
        ~^/api/             "";
        default             "no-cache";
    }

    include /etc/nginx/conf.d/*.conf;
}
